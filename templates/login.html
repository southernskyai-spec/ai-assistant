<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Assistant - Login</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 360px;
    margin: 100px auto;
    background: #f4f4f7;
  }
  form {
    background: white;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }
  input {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2952cc;
    color: white;
    cursor: pointer;
  }
  .error {
    color: #c00;
  }
</style>
</head>
<body>
<h2>AI Assistant</h2>
<form method="POST">
  <input type="password" name="password" placeholder="Password" required autofocus>
  <button type="submit">Enter</button>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</form>
</body>
</html>
